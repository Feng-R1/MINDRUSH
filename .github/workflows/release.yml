name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
      - name: Install locked frontend dependencies
        run: npm ci --prefix frontend
      - name: Check matching versions
        run: npm run check:version
      - name: Rust tests
        run: cargo test --workspace --all-targets --locked
      - name: Build installers
        run: npm run desktop:build -- --ci --bundles nsis,msi -- --locked --bin mindrush
      - name: Create portable ZIP and checksums
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Path release-assets
          Copy-Item target/release/bundle/nsis/*.exe release-assets/
          Copy-Item target/release/bundle/msi/*.msi release-assets/
          Compress-Archive -Path target/release/mindrush.exe -DestinationPath "release-assets/MindRush-$version-windows-x64-portable.zip"
          Get-ChildItem release-assets -File | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MindRush-Windows
          path: release-assets/*
          if-no-files-found: error
      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must look like v1.2.3: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $notes = "docs/release-$version.md"
          if (Test-Path $notes) {
            Copy-Item $notes .github/release-notes.md
          } else {
            "## MindRush $version`n`nDownload the Windows x64 installer below and verify its SHA256 checksum using SHA256SUMS.txt. Configure your own model endpoint in the app. Model API usage may incur provider charges." | Set-Content .github/release-notes.md -Encoding utf8
          }
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes.md
          files: release-assets/*
          fail_on_unmatched_files: true
